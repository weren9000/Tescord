[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tescord-backend"
version = "0.1.0"
description = "FastAPI backend for Altgramm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyotp>=2.9,<3",
  "cryptography>=46,<52",
  "segno>=1.6,<2",
  "psutil>=7.2.2,<8",
  "Pillow>=13.0,<14",
  "certifi>=2026.10.19",
  "redis>=5.2,<7",
  "alembic>=1.16.0",
  "fastapi>=0.116.0",
  "starlette>=1.3.1,<2",
  "livekit-api>=1.1.0",
  "pywebpush>=2.0.3",
  "python-multipart>=0.0.31,<1",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.14.2,<3",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
