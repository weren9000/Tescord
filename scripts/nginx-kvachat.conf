# Install in the nginx http context (sites-enabled on Ubuntu).
log_format kva_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=kva_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=kva_connections:10m;
map $http_upgrade $kva_connection { default upgrade; '' close; }
map $request_uri $kva_robots {
    default "";
    ~^/(?:channels|invite|api|livekit)(?:/|\?|$) "noindex, nofollow";
}
server {
    listen 80;
    server_name kvachat.ru;
    access_log /var/log/nginx/kvachat-access.log kva_safe;
    return 301 https://kvachat.ru$request_uri;
}
server {
    listen 443 ssl http2;
    server_name kvachat.ru;
    ssl_certificate /etc/nginx/ssl/kvachat.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/kvachat.ru/privkey.pem;
    root /srv/tescord/current/frontend/dist/frontend/browser;
    index index.html;
    access_log /var/log/nginx/kvachat-access.log kva_safe;
    # Error logs can contain the original query string; critical infrastructure errors only.
    error_log /var/log/nginx/kvachat-error.log crit;
    client_max_body_size 501m;
    client_body_timeout 30s;
    limit_conn kva_connections 100;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag $kva_robots always;
    location = /index.html { expires -1; try_files $uri =404; }
    location = /runtime-config.js { expires -1; try_files $uri =404; }
    location ~* ^/(?:main|polyfills|styles|chunk)-[A-Z0-9]+\.(?:js|css)$ {
        expires 1y;
        try_files $uri =404;
    }
    location = / { expires -1; try_files /index.html =404; }
    location ~ ^/(?:channels/[a-zA-Z0-9-]+/[a-zA-Z0-9-]+|invite/[^/]+)/?$ {
        expires -1;
        try_files /index.html =404;
    }
    location / { expires -1; try_files $uri =404; }
    location = /livekit { return 301 /livekit/; }
    location = /_sfu_authorize {
        internal;
        proxy_pass http://127.0.0.1:8000/api/voice/authorize-sfu;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Sfu-Token $kva_sfu_token;
        proxy_set_header Host $host;
    }
    location /livekit/ {
        set $kva_sfu_token $arg_access_token;
        auth_request /_sfu_authorize;
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kva_connection;
        proxy_read_timeout 120s;
    }
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=kva_auth burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kva_connection;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
