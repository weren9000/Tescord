[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kvachat-game-calendar"
version = "0.1.0"
description = "Independent read-only LARP calendar plugin for KvaChat"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "Pillow>=12.0,<13", "certifi>=2025.1.31"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["game_calendar"]
