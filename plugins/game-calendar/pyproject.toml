[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kvachat-game-calendar"
version = "0.1.0"
description = "Independent read-only LARP calendar plugin for KvaChat"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "starlette>=1.3.1,<2", "uvicorn>=0.35,<1", "Pillow>=13.0,<14", "certifi>=2026.10.19"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["game_calendar"]
