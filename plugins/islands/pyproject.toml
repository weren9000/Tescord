[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kvachat-islands"
version = "0.1.0"
description = "Independent multiplayer Islands game for Kvachat"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "starlette>=1.3.1,<2", "uvicorn>=0.35,<1", "websockets>=17,<18", "cryptography>=46,<52"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["islands"]
