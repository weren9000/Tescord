# Include in the existing HTTPS server. The existing http-level map defines
# $kva_connection. Strip the prefix; uvicorn supplies root_path for redirects.
location = /plugins/islands { return 308 /plugins/islands/; }
location ^~ /plugins/islands/ {
    proxy_pass http://127.0.0.1:8013/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $kva_connection;
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
    client_max_body_size 8k;
    client_body_timeout 10s;
    proxy_buffering off;
    # These location headers deliberately override inherited SAMEORIGIN.
    # The service sets a precise CSP frame-ancestors allowlist including the
    # Android wrapper's https://localhost origin; no arbitrary embedding.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
