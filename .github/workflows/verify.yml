name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: test_kva
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TESCORD_DATABASE_URL: postgresql+psycopg://postgres:test-only@127.0.0.1:5432/test_kva
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock -r requirements-dev.lock
      - run: alembic upgrade head
      - run: timeout 180 pytest -q -o faulthandler_timeout=60
      - run: pip check
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm audit --omit=dev --audit-level=high
  native:
    # Compile/package checks only. The fixture TURN configuration is never released.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: desktop
          - os: ubuntu-latest
            target: mobile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            ${{ matrix.target }}/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm ci --prefix ${{ matrix.target }}
      - name: Prepare compile-only runtime fixture
        shell: bash
        run: |
          echo '{"iceServers":[{"urls":"turn:ci.invalid:3478","username":"compile-only","credential":"compile-only"}]}' > "$RUNNER_TEMP/native-runtime.json"
          echo "KVA_NATIVE_RUNTIME_CONFIG=$RUNNER_TEMP/native-runtime.json" >> "$GITHUB_ENV"
      - if: matrix.target == 'desktop'
        run: npm run pack --prefix desktop
      - if: matrix.target == 'mobile'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.target == 'mobile'
        name: Build and lint unsigned Android package
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          node mobile/prepare-web.cjs
          cd mobile
          npm run sync
          cd android
          bash gradlew assembleRelease lintDebug --console=plain
