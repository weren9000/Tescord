<section aria-label="Список площадок" [class.collapsed]="collapsed()">
  <header><h2>Площадки</h2><button class="collapse" [attr.aria-label]="collapsed()?'Развернуть площадки':'Свернуть площадки'" [attr.title]="collapsed()?'Развернуть площадки':'Свернуть площадки'" [attr.aria-expanded]="!collapsed()" (click)="toggle.emit()"><app-ui-icon [name]="collapsed()?'forward':'back'"/></button></header>
  <label class="search"><app-ui-icon name="search"/><input aria-label="Поиск площадок" placeholder="Найти площадку" [ngModel]="query()" (ngModelChange)="query.set($event)"/></label>
  <div class="spaces">@for(s of visible();track s.id){<button class="space" [class.active]="selected()===s.id" [attr.aria-current]="selected()===s.id?'page':null" [attr.aria-label]="s.name" [title]="s.name" (click)="select.emit(s.id)"><span class="icon">@if(s.icon&&!failed().has(s.id)){<img [src]="s.icon" alt="" loading="lazy" (error)="imageError(s.id)"/>}@else{ {{s.name.slice(0,2)}} }</span><span class="copy"><strong>{{s.name}}</strong><small>{{s.description || 'Чаты сообщества'}}</small></span>@if(s.unread||s.mentions){<span class="badge">{{s.mentions?'@'+s.mentions:s.unread}}</span>}</button>}@empty{<div class="empty"><app-ui-icon name="platforms"/><strong>{{query()?'Ничего не найдено':'Ваши сообщества'}}</strong><p>{{query()?'Попробуйте другое название':'Создайте площадку или войдите по приглашению.'}}</p></div>}</div>
  <footer><button class="create" (click)="create.emit()" aria-label="Создать площадку" title="Создать площадку"><app-ui-icon name="plus"/><span>Создать площадку</span></button><button class="join" (click)="join.emit()" aria-label="Войти по приглашению" title="Войти по приглашению"><app-ui-icon name="forward"/><span>По приглашению</span></button></footer>
</section>
